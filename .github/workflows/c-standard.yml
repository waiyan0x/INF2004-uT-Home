name: C standard and host acceptance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c-standard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            tools/c_standard/requirements.txt
            tools/requirements.txt
            tools/config_transfer/requirements.txt
            tools/config_transfer/requirements-dev.txt
            tools/transaction/requirements.txt
      - name: Install pinned formatting and host test dependencies
        run: python -m pip install -r tools/c_standard/requirements.txt -r tools/requirements.txt -r tools/config_transfer/requirements.txt -r tools/config_transfer/requirements-dev.txt -r tools/transaction/requirements.txt
      - name: Require the host compiler
        run: gcc --version
      - name: Enforce BARR-C policy
        run: python tools/c_standard/check.py --root .
      - name: Verify the policy checker
        run: python -m unittest discover -s tests/c_standard -p 'test_*.py' -v
      - name: Verify host data contracts
        run: python -m mypy --config-file tools/config_transfer/mypy.ini
      - name: Run foundation acceptance
        run: python -m unittest discover -s tests/foundation -p 'test_*.py' -v
      - name: Verify discovery contracts and matching
        run: python -B -m unittest discover -s tests/discovery -p 'test_*.py' -v
      - name: Run runtime C suites
        run: python -m unittest discover -s tests/runtime -p 'test_*.py' -v
      - name: Fetch pinned kernel for Buddy 1 host tests
        run: git submodule update --init --recursive firmware/third_party/esp32c3-mtk3
      - name: Run Buddy 1 static task tests
        run: |
          python -m unittest discover -s tests/buddy1 -p test_fixed_stack_pool.py -v
          for test in tests/buddy1/test_shim_*.py tests/buddy1/test_c3task_static_pool.py tests/buddy1/test_c3task_alignment.py tests/buddy1/test_c3task_no_static.py tests/buddy1/test_fixed_stack_stress.py; do python "$test"; done
      - name: Run target failure and build-tool tests
        run: python -m unittest discover -s tests/target -p 'test_*.py' -v

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify JavaScript source
        run: |
          npm ci --ignore-scripts
          npm run lint
      - name: Verify dashboard and wiring visualiser
        run: |
          node --test tests/target/test_*.mjs
          node --test tools/wiring_visualiser/tests/*.test.mjs

      - name: Verify real browser composition and asynchronous transitions
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser

      - name: Run standalone UART/GPIO regressions
        run: |
          python tools/test_uart_gpio.py


  esp32c3:
    name: ESP32-C3 / ${{ matrix.image }}
    needs: c-standard
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        image: [acceptance, configuration, mqtt-transaction]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read the repository's exact pins
        shell: bash
        run: |
          echo "IDF_TOOLS_PATH=$RUNNER_TEMP/idf-tools" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/uthome-ci"
          python - <<'PY'
          import os
          from tools.target import qualify_kernel as module
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"UTHOME_SDK_REV={module.SDK_REVISION}\n")
              output.write(f"UTHOME_KERNEL_REV={module.KERNEL_REVISION}\n")
          PY
      - name: Fetch pinned SDK and kernel without changing project dependencies
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/esp-idf"
          git -C "$RUNNER_TEMP/esp-idf" remote add origin https://github.com/espressif/esp-idf.git
          git -C "$RUNNER_TEMP/esp-idf" fetch --depth 1 origin "$UTHOME_SDK_REV"
          git -C "$RUNNER_TEMP/esp-idf" checkout --detach FETCH_HEAD
          git -C "$RUNNER_TEMP/esp-idf" submodule update --init --recursive --depth 1
          git init "$RUNNER_TEMP/uthome-kernel"
          git -C "$RUNNER_TEMP/uthome-kernel" remote add origin https://github.com/sirfonzie/esp32c3-mtk3.git
          git -C "$RUNNER_TEMP/uthome-kernel" fetch --depth 1 origin "$UTHOME_KERNEL_REV"
          git -C "$RUNNER_TEMP/uthome-kernel" checkout --detach FETCH_HEAD
      - name: Install the SDK's pinned ESP32-C3 tools
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/esp-idf/install.sh" esp32c3 2>&1 | tee "$RUNNER_TEMP/uthome-ci/install.log"
      - name: Build and qualify the image
        shell: bash
        env:
          UTHOME_IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/esp-idf/export.sh"
          python -m pip install -r tools/c_standard/requirements.txt -r tools/requirements.txt
          args=()
          if [ "$UTHOME_IMAGE" != acceptance ]; then args+=(--configuration-app); fi
          if [ "$UTHOME_IMAGE" = mqtt-transaction ]; then
            # Build-only inputs: never provision a user's SSID, password or key.
            lab="$RUNNER_TEMP/lab-fixture"
            mkdir -m 700 "$lab"
            openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=ci.invalid \
              -keyout "$lab/key.pem" -out "$lab/cert.pem"
            python - "$lab/settings.json" <<'PY'
          import json, secrets, sys
          from pathlib import Path
          Path(sys.argv[1]).write_text(json.dumps(dict(
              ssid="uthome-ci.invalid", password=secrets.token_hex(16),
              token=secrets.token_hex(24), certificate_file="cert.pem",
              key_file="key.pem", mqtt=dict(address="127.0.0.1",
              server_name="ci.invalid", port=8883, user="ci-device",
              password=secrets.token_hex(16), ca_file="cert.pem"))))
          PY
            args+=(--static-net-queues --network-services wifi --network-settings "$lab/settings.json")
          fi
          python tools/target/qualify_kernel.py build \
            --kernel "$RUNNER_TEMP/uthome-kernel" \
            --sdk "$RUNNER_TEMP/esp-idf" \
            --work-dir "$RUNNER_TEMP/uthome-build" \
            --runtime-port "${args[@]}" \
            --compat-patch firmware/third_party/patches/0002-esp-idf-6.1-build.patch \
            --resource-patch firmware/third_party/patches/0001-uthome-c3-resources.patch \
            2>&1 | tee "$RUNNER_TEMP/uthome-ci/qualification.log"
      - name: Verify MQTT transactions were compiled and linked
        if: matrix.image == 'mqtt-transaction'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/uthome-build/build"
          python - <<'PY'
          import json, re
          from pathlib import Path
          rows = json.loads(Path("compile_commands.json").read_text())
          adapter, = [r for r in rows if Path(r["file"]).name == "c3mqtt.c"]
          assert "-DUTHOME_MQTT_VALUE_BYTES=112" in adapter["command"].split()
          header = Path("../project/app/netsetup.h").read_text()
          assert re.search(r"#define UTHOME_SETUP_MQTT +[(]1U[)]", header)
          linked = "\n".join(m.read_text() for m in Path(".").glob("*.map"))
          assert all(symbol in linked for symbol in ("txjob_submit", "c3tx_step", "c3mqtt_transactions"))
          PY
      - name: Preserve build and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esp32c3-${{ matrix.image }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/uthome-ci/*.log
            ${{ runner.temp }}/uthome-build/evidence.json
            ${{ runner.temp }}/uthome-build/build.log
            ${{ runner.temp }}/uthome-build/sdkconfig
            ${{ runner.temp }}/uthome-build/project/source-manifest.json
            ${{ runner.temp }}/uthome-build/project/dependencies.lock
            ${{ runner.temp }}/uthome-build/build/*.elf
            ${{ runner.temp }}/uthome-build/build/*.map
            ${{ runner.temp }}/uthome-build/build/*.bin
            ${{ runner.temp }}/uthome-build/build/bootloader/*.bin
            ${{ runner.temp }}/uthome-build/build/partition_table/*.bin
            ${{ runner.temp }}/uthome-build/build/compile_commands.json
            ${{ runner.temp }}/uthome-build/build/flasher_args.json
